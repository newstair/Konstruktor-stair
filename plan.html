<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чертеж лестницы (Метод двух линий)</title>
<style>
  body { margin:0; background:#f4f4f4; font-family:sans-serif; display:flex; flex-direction:column; height:100vh; }
  #controls { padding:10px; background:#fff; border-bottom:1px solid #ccc; display:flex; gap:20px; align-items:center; }
  #viewport { flex:1; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; cursor:grab; }
  svg:active { cursor:grabbing; }
</style>
</head>
<body>

<div id="controls">
  <label>Забежных ступеней (веер): <input type="range" id="winders" min="3" max="9" value="5"> <span id="winders-val">5</span></label>
  <label>Мин. ширина у столба: <input type="number" id="minWidth" value="100" style="width:60px;"> мм</label>
</div>

<div id="viewport">
  <svg id="svg" viewBox="-2500 -500 4000 3500" xmlns="http://www.w3.org/2000/svg">
    <!-- Сетка -->
    <defs>
      <pattern id="grid" width="500" height="500" patternUnits="userSpaceOnUse">
        <path d="M 500 0 L 0 0 0 500" fill="none" stroke="#e0e0e0" stroke-width="2"/>
      </pattern>
    </defs>
    <rect x="-3000" y="-1000" width="5000" height="5000" fill="url(#grid)" />
    
    <!-- Группа для чертежа -->
    <g id="drawing"></g>
  </svg>
</div>

<script>
const svg = document.getElementById('svg');
const drawing = document.getElementById('drawing');
const windersInput = document.getElementById('winders');
const windersVal = document.getElementById('winders-val');
const minWidthInput = document.getElementById('minWidth');

// --- ПАРАМЕТРЫ ИЗ ЗАДАЧИ ---
const startLen = 2000;   // Длина захода (по X)
const endLen = 2400;     // Длина выхода (по Y)
const stairWidth = 900;  // Ширина марша
const totalH = 2900;     // Высота этажа (для расчета количества ступеней)

// --- РАСЧЕТ КОЛИЧЕСТВА СТУПЕНЕЙ ---
// Стандартная высота подступенка ~ 180 мм. 2900 / 180 = 16.1. Берем 16 подъемов (15 проступей).
// Нам нужно распределить 15 проступей: начало, веер, выход.
// Для примера: 6 шагов начало, N веер, остальное выход.

function draw() {
  const numWinders = parseInt(windersInput.value);
  const minW = parseFloat(minWidthInput.value);
  
  // Очищаем
  drawing.innerHTML = '';

  // 1. Рассчитываем геометрию
  // Внутренний радиус (отступ от угла). 
  // Мы хотим, чтобы ширина забежной ступени у столба была >= minW.
  // Ширина на внутреннем радиусе = (PI * R_in / 2) / numWinders.
  // Отсюда R_in = (minW * numWinders * 2) / PI.
  const R_in = (minW * numWinders * 2) / Math.PI;
  const R_walk = R_in + stairWidth / 2;
  const R_out = R_in + stairWidth;

  // Количество прямых ступеней
  // Общее кол-во подъемов 16. Значит проступей 15.
  // Отдадим 6 на начало и остаток на выход.
  const nStart = 6;
  const nEnd = 15 - numWinders - nStart;
  if (nEnd < 1) return; // Защита

  // Ширина прямой ступени (стандартная)
  const stepDepth = 280; 
  
  // --- РИСОВАНИЕ СТЕН ---
  const walls = `
    <path d="M -${startLen} 0 L 0 0 L 0 ${endLen}" fill="none" stroke="#333" stroke-width="20" />
    <path d="M -${startLen} -50 L -${startLen} 0" stroke="#333" stroke-width="20" />
    <path d="M 50 ${endLen} L 0 ${endLen}" stroke="#333" stroke-width="20" />
  `;
  drawing.innerHTML += walls;

  // --- РИСОВАНИЕ ЛИНИЙ (Внутренняя и Маршевая) ---
  // Внутренняя линия: прямая по X, дуга, прямая по Y
  const pathInner = `
    M -${startLen} ${R_in} 
    L 0 ${R_in} 
    A ${R_in} ${R_in} 0 0 1 ${R_in} 0 
    L ${R_in} ${endLen}
  `;
  
  // Маршевая линия: прямая по X, дуга, прямая по Y
  const pathWalk = `
    M -${startLen} ${R_walk} 
    L 0 ${R_walk} 
    A ${R_walk} ${R_walk} 0 0 1 ${R_walk} 0 
    L ${R_walk} ${endLen}
  `;

  // Отрисовка направляющих (красная - маршевая, синяя - внутренняя)
  drawing.innerHTML += `<path d="${pathInner}" fill="none" stroke="#4a7dff" stroke-width="4" stroke-dasharray="10,10" />`;
  drawing.innerHTML += `<path d="${pathWalk}" fill="none" stroke="#e63946" stroke-width="4" stroke-dasharray="10,10" />`;

  // --- ГЕНЕРАЦИЯ ТОЧЕК СТУПЕНЕЙ ---
  const pointsInner = [];
  const pointsWalk = [];

  // 1. Прямой участок (Начало) - точки идут с одинаковым шагом по X
  for (let i = 0; i <= nStart; i++) {
    const x = -startLen + i * stepDepth;
    pointsInner.push({ x, y: R_in });
    pointsWalk.push({ x, y: R_walk });
  }

  // 2. Забежный участок (Поворот)
  // Мы уже имеем последнюю точку прямого участка (x=0).
  // Делим дугу на numWinders частей.
  const stepAngle = (Math.PI / 2) / numWinders;
  for (let i = 1; i <= numWinders; i++) {
    const a = i * stepAngle; // Угол от 0 до 90
    // Координаты на дуге (центр в 0,0)
    const pInX = R_in * Math.sin(a);
    const pInY = R_in * Math.cos(a);
    pointsInner.push({ x: pInX, y: pInY });

    const pWalkX = R_walk * Math.sin(a);
    const pWalkY = R_walk * Math.cos(a);
    pointsWalk.push({ x: pWalkX, y: pWalkY });
  }

  // 3. Прямой участок (Выход)
  // Начинаем с последней точки веера
  for (let i = 1; i <= nEnd; i++) {
    const y = i * stepDepth;
    pointsInner.push({ x: R_in, y });
    pointsWalk.push({ x: R_walk, y });
  }

  // --- ОТРИСОВКА СТУПЕНЕЙ ---
  // Соединяем точки линиями, образуя полигоны
  for (let i = 0; i < pointsInner.length - 1; i++) {
    const p1 = pointsInner[i];
    const p2 = pointsInner[i+1];
    const p3 = pointsWalk[i+1];
    const p4 = pointsWalk[i];
    
    // Вычисляем внешнюю точку (R_out)
    // Для простоты используем проекцию от центра (0,0)
    const len = Math.sqrt(p1.x**2 + p1.y**2);
    const out1_x = (p1.x / len) * (R_out);
    const out1_y = (p1.y / len) * (R_out);

    const len2 = Math.sqrt(p2.x**2 + p2.y**2);
    const out2_x = (p2.x / len2) * (R_out);
    const out2_y = (p2.y / len2) * (R_out);

    let polyPoints = "";
    if (i < nStart || i >= nStart + numWinders) {
      // Прямые ступени
      const isX = i < nStart;
      if (isX) {
        polyPoints = `${p1.x},${p1.y} ${p2.x},${p2.y} ${p2.x},${R_out} ${p1.x},${R_out}`;
      } else {
        polyPoints = `${p1.x},${p1.y} ${p1.x},${R_out} ${p2.x},${R_out} ${p2.x},${p2.y}`;
      }
    } else {
      // Забежные ступени (веер)
      polyPoints = `${p1.x},${p1.y} ${out1_x},${out1_y} ${out2_x},${out2_y} ${p2.x},${p2.y}`;
    }

    // Рисуем полигон ступени
    drawing.innerHTML += `<polygon points="${polyPoints}" fill="#f4e1c1" stroke="#333" stroke-width="2" />`;

    // Ставим номер ступени
    const cx = (p1.x + p2.x + out1_x + out2_x) / 4;
    const cy = (p1.y + p2.y + out1_y + out2_y) / 4;
    drawing.innerHTML += `<text x="${cx}" y="${cy}" font-size="40" font-weight="bold" fill="#666" text-anchor="middle">${i+1}</text>`;
    
    // Размер проступи у внутренней линии (для проверки правила 100мм)
    const stepWidthInner = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
    if (i >= nStart && i < nStart + numWinders) {
      drawing.innerHTML += `<text x="${p1.x + 20}" y="${p1.y + 20}" font-size="30" fill="#4a7dff">${stepWidthInner.toFixed(0)}</text>`;
    }
  }

  // Рисуем опорный столб в углу
  drawing.innerHTML += `<rect x="0" y="0" width="100" height="100" fill="#8b4513" transform="translate(-50,-50)" />`;
}

// Слушатели
windersInput.addEventListener('input', (e) => {
  windersVal.textContent = e.target.value;
  draw();
});
minWidthInput.addEventListener('input', draw);

// Первый запуск
draw();

// Панорамирование (простой скрипт для перемещения viewBox)
let isDragging = false;
let startX, startY;
let viewBox = [-2500, -500, 4000, 3500];
svg.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; });
svg.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = (e.clientX - startX) * (viewBox[2] / svg.clientWidth);
  const dy = (e.clientY - startY) * (viewBox[3] / svg.clientHeight);
  viewBox[0] -= dx;
  viewBox[1] -= dy;
  svg.setAttribute('viewBox', viewBox.join(' '));
  startX = e.clientX; startY = e.clientY;
});
svg.addEventListener('mouseup', () => isDragging = false);
svg.addEventListener('mouseleave', () => isDragging = false);
// Зум
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const scale = e.deltaY > 0 ? 1.1 : 0.9;
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const w = viewBox[2] * scale;
  const h = viewBox[3] * scale;
  viewBox[0] += (viewBox[2] - w) * (mx / rect.width);
  viewBox[1] += (viewBox[3] - h) * (my / rect.height);
  viewBox[2] = w;
  viewBox[3] = h;
  svg.setAttribute('viewBox', viewBox.join(' '));
});
</script>
</body>
</html>
